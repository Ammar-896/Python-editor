<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PyWrite — Online Python Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/autorefresh.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/keymap/sublime.min.js"></script>
<style>
:root {
  --bg:        #0c0e14;
  --bg2:       #10121a;
  --surface:   #141720;
  --surface2:  #1c2030;
  --surface3:  #222638;
  --border:    #232840;
  --border2:   #2e3450;
  --accent:    #00e5a0;
  --accent-dim:#00b87e;
  --purple:    #7c6af7;
  --blue:      #4d9fff;
  --yellow:    #f5c542;
  --warn:      #ff6b6b;
  --text:      #dde1f0;
  --text2:     #8b92b0;
  --text3:     #545a78;
  --mono:      'JetBrains Mono', monospace;
  --ui:        'Syne', sans-serif;
  --sidebar-w: 240px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── HEADER ─────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 10px;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--ui);
  font-weight: 800;
  font-size: 16px;
  letter-spacing: -0.5px;
  user-select: none;
}
.logo-mark {
  width: 30px; height: 30px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800;
  color: #000;
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
}
.logo-mark:hover { background: #00ffb3; transform: scale(1.05); }
.logo-mark.flash { background: var(--purple); transform: scale(1.1); }
.logo-text { color: var(--text); }
.logo-text span { color: var(--accent); }

.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.hbtn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 7px;
  font-family: var(--ui);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  transition: all .15s;
  white-space: nowrap;
  letter-spacing: 0.2px;
}
.hbtn:hover { color: var(--text); background: var(--surface2); border-color: var(--border2); }
.hbtn svg { width: 13px; height: 13px; flex-shrink:0; }

.hbtn-run {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  box-shadow: 0 0 18px rgba(0,229,160,.25);
}
.hbtn-run:hover { background: #00ffb3; border-color: #00ffb3; box-shadow: 0 0 28px rgba(0,229,160,.4); }
.hbtn-run:disabled { background: #1a3d30; color: #2a6650; border-color: transparent; cursor: not-allowed; box-shadow:none; }

.kbd-hint {
  font-family: var(--mono);
  font-size: 10px;
  background: rgba(0,0,0,.3);
  padding: 1px 5px;
  border-radius: 4px;
  color: rgba(0,0,0,.6);
}

.font-ctrl { display:flex; gap:2px; }
.font-ctrl button {
  width: 26px; height: 26px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text2);
  cursor: pointer;
  font-size: 12px;
  font-family: var(--mono);
  display: flex; align-items:center; justify-content:center;
  transition: all .1s;
}
.font-ctrl button:hover { color: var(--text); border-color: var(--border2); }

/* ─── WORKSPACE ──────────────────────────────────────────────── */
.workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ─── SIDEBAR ACTIVITY BAR ───────────────────────────────────── */
.activity-bar {
  width: 40px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  gap: 4px;
  flex-shrink: 0;
}
.act-btn {
  width: 32px; height: 32px;
  border-radius: 7px;
  display: flex; align-items:center; justify-content:center;
  cursor: pointer;
  color: var(--text3);
  background: transparent;
  border: none;
  transition: all .15s;
  font-size: 15px;
}
.act-btn:hover { color: var(--text2); background: var(--surface2); }
.act-btn.active { color: var(--accent); background: rgba(0,229,160,.08); }

/* ─── FILE EXPLORER ──────────────────────────────────────────── */
.explorer {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: width .2s;
}
.explorer.hidden { width: 0; }

.explorer-title {
  padding: 10px 14px 6px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}

.explorer-body {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  padding-bottom: 20px;
}
.explorer-body::-webkit-scrollbar { width: 4px; }
.explorer-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Section header (collapsible) ── */
.section-hdr {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 10px 5px;
  cursor: pointer;
  user-select: none;
  transition: background .1s;
  flex-shrink: 0;
}
.section-hdr:hover { background: var(--surface2); }
.section-hdr .chevron {
  width: 14px; height: 14px;
  color: var(--text3);
  transition: transform .2s;
  flex-shrink: 0;
}
.section-hdr.collapsed .chevron { transform: rotate(-90deg); }
.section-hdr .sec-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text2);
}
.section-body { display: flex; flex-direction: column; }
.section-body.collapsed { display: none; }

/* ── Folder row ── */
.folder-row {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px 4px 14px;
  cursor: pointer;
  user-select: none;
  border-radius: 0;
  transition: background .1s;
}
.folder-row:hover { background: var(--surface2); }
.folder-row .chevron {
  width: 12px; height: 12px;
  color: var(--text3);
  transition: transform .18s;
  flex-shrink: 0;
}
.folder-row.collapsed .chevron { transform: rotate(-90deg); }
.folder-icon { font-size: 13px; flex-shrink: 0; }
.folder-label {
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text2);
  font-weight: 500;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── File row ── */
.file-list { display: flex; flex-direction: column; }
.file-list.collapsed { display: none; }

.file-row {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px 3px 30px;
  cursor: pointer;
  border-radius: 0;
  transition: background .1s;
  position: relative;
}
.file-row:hover { background: var(--surface2); }
.file-row.active {
  background: rgba(0,229,160,.08);
}
.file-row.active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}
.file-icon { font-size: 12px; flex-shrink: 0; }
.file-name {
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-row.active .file-name { color: var(--accent); }
.file-row:not(.active) .file-name { color: var(--text2); }
.file-row:hover .file-name { color: var(--text); }

/* Modified dot */
.file-modified {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--yellow);
  flex-shrink: 0;
}

/* Workspace file (main.py) special styling */
.ws-file-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px 5px 18px;
  cursor: pointer;
  transition: background .1s;
  position: relative;
}
.ws-file-row:hover { background: var(--surface2); }
.ws-file-row.active {
  background: rgba(0,229,160,.08);
}
.ws-file-row.active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}
.ws-filename {
  font-size: 12.5px;
  font-family: var(--mono);
  color: var(--text);
  flex: 1;
  font-weight: 500;
}
.ws-file-row.active .ws-filename { color: var(--accent); }

.new-file-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 18px;
  cursor: pointer;
  transition: all .1s;
  color: var(--text3);
  font-size: 11px;
  font-family: var(--mono);
}
.new-file-btn:hover { color: var(--accent); background: var(--surface2); }

/* ─── EDITOR PANEL ───────────────────────────────────────────── */
.editor-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ── Tab bar ── */
.tab-bar {
  display: flex;
  align-items: stretch;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  height: 36px;
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }

.tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 14px;
  border-right: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text3);
  background: transparent;
  border-bottom: 2px solid transparent;
  min-width: 0;
  flex-shrink: 0;
  transition: all .12s;
  position: relative;
}
.tab:hover { color: var(--text2); background: var(--surface2); }
.tab.active {
  color: var(--text);
  background: var(--bg);
  border-bottom-color: var(--accent);
}
.tab .tab-icon { font-size: 11px; }
.tab .tab-close {
  width: 16px; height: 16px;
  border-radius: 3px;
  display: flex; align-items:center; justify-content:center;
  font-size: 11px;
  color: var(--text3);
  transition: all .1s;
  flex-shrink: 0;
  opacity: 0;
}
.tab:hover .tab-close { opacity: 1; }
.tab.active .tab-close { opacity: 0.5; }
.tab .tab-close:hover { opacity: 1 !important; color: var(--warn); background: rgba(255,107,107,.15); }
.tab .tab-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--yellow);
  flex-shrink: 0;
}

/* Breadcrumb bar */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 14px;
  height: 26px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  flex-shrink: 0;
}
.breadcrumb span { color: var(--text2); }
.breadcrumb .sep { color: var(--text3); }

/* CodeMirror */
.CodeMirror {
  font-family: var(--mono) !important;
  font-size: 14px;
  line-height: 1.75;
  height: 100% !important;
  background: var(--bg) !important;
}
.CodeMirror-scroll { padding-bottom: 80px; }
.CodeMirror-gutters { background: var(--bg) !important; border-right: 1px solid var(--border) !important; min-width: 44px; }
.CodeMirror-linenumber { color: var(--text3) !important; font-size: 12px; padding: 0 8px 0 6px !important; }
.CodeMirror-cursor { border-color: var(--accent) !important; }
.CodeMirror-selected { background: rgba(124,106,247,.18) !important; }

.editor-wrapper { flex: 1; overflow: hidden; }

/* ─── OUTPUT PANEL ───────────────────────────────────────────── */
.output-panel {
  height: 34%;
  min-height: 100px;
  max-height: 70%;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.resize-handle {
  height: 5px;
  cursor: ns-resize;
  background: transparent;
  flex-shrink: 0;
  position: relative;
}
.resize-handle::after {
  content: '';
  position: absolute;
  top: 1px; left: 50%;
  transform: translateX(-50%);
  width: 44px; height: 3px;
  background: var(--border);
  border-radius: 2px;
  transition: background .15s;
}
.resize-handle:hover::after { background: var(--accent); }

.output-header {
  display: flex;
  align-items: center;
  gap: 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  height: 34px;
}

.output-tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 16px;
  height: 100%;
  font-size: 11px;
  font-family: var(--mono);
  font-weight: 500;
  color: var(--text2);
  border-bottom: 2px solid var(--accent);
  letter-spacing: 0.3px;
}

.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text3);
  transition: all .3s;
  flex-shrink: 0;
}
.status-dot.running { background: var(--accent); animation: pulse 1s infinite; }
.status-dot.error   { background: var(--warn); }
.status-dot.ok      { background: var(--accent); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.output-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  padding-right: 10px;
}
.out-action-btn {
  width: 24px; height: 24px;
  border-radius: 5px;
  background: transparent;
  border: none;
  color: var(--text3);
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  font-size: 12px;
  transition: all .1s;
}
.out-action-btn:hover { color: var(--text2); background: var(--surface2); }

.output-body {
  flex: 1;
  overflow-y: auto;
  padding: 10px 16px 14px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.output-body::-webkit-scrollbar { width: 5px; }
.output-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.out-line { display: block; }
.out-line.stdout { color: #c8d0e0; }
.out-line.stderr { color: var(--warn); }
.out-line.info   { color: var(--accent); opacity: .7; font-style: italic; }
.out-line.timing { color: var(--purple); font-style: italic; }
.out-line.welcome { color: var(--accent); font-weight: 500; }

/* Inline stdin */
.stdin-line {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  min-height: 1.7em;
}
.stdin-prompt-text {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 13px;
  white-space: pre;
  flex-shrink: 0;
}
.stdin-typed-value {
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  white-space: pre;
}
.stdin-inline-input {
  flex: 1;
  min-width: 100px;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--accent);
  padding: 0 2px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  outline: none;
  caret-color: var(--accent);
}

/* ─── LOADING OVERLAY ────────────────────────────────────────── */
#loading-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
  z-index: 999;
  transition: opacity .4s;
}
#loading-overlay.hidden { opacity:0; pointer-events:none; }
.loader-logo { font-family: var(--ui); font-size: 30px; font-weight: 800; letter-spacing: -1px; }
.loader-logo span { color: var(--accent); }
.loader-bar { width: 180px; height: 2px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.loader-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width .3s ease; }
.loader-text { font-size: 11px; color: var(--text3); font-family: var(--mono); }

/* ─── AI PANEL ───────────────────────────────────────────────── */
#ai-panel {
  position: fixed; inset: 0; z-index: 500;
  display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(8px);
}
#ai-panel.open { display: flex; }

.ai-window {
  width: min(660px, 96vw);
  height: min(600px, 92vh);
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 16px;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(124,106,247,.15), 0 30px 80px rgba(0,0,0,.6);
  animation: aiIn .2s ease;
}
@keyframes aiIn { from{opacity:0;transform:scale(.96) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }

.ai-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.ai-title { display:flex; align-items:center; gap:9px; font-weight:700; font-size:14px; }
.ai-badge {
  background: linear-gradient(135deg, var(--purple), #a78bfa);
  color:#fff; font-size:10px; font-weight:800;
  padding: 2px 8px; border-radius:20px; letter-spacing:.5px; text-transform:uppercase;
}
.ai-x {
  width:28px; height:28px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:7px; color:var(--text2); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:16px;
  transition:all .15s; border:none;
}
.ai-x:hover { color:var(--warn); }
.ai-msgs {
  flex:1; overflow-y:auto; padding:16px;
  display:flex; flex-direction:column; gap:10px;
  scrollbar-width:thin; scrollbar-color: var(--border) transparent;
}
.ai-msg {
  max-width:88%; padding:10px 14px; border-radius:12px;
  font-size:13px; line-height:1.65; white-space:pre-wrap; word-break:break-word;
}
.ai-msg.user { align-self:flex-end; background:rgba(124,106,247,.18); border:1px solid rgba(124,106,247,.28); border-bottom-right-radius:4px; }
.ai-msg.assistant { align-self:flex-start; background:var(--surface2); border:1px solid var(--border); color:#c8d0e0; border-bottom-left-radius:4px; }
.ai-msg.sys { align-self:center; background:transparent; border:none; color:var(--text3); font-size:11px; font-style:italic; padding:3px 0; }
.ai-msg.thinking { align-self:flex-start; background:var(--surface2); border:1px solid var(--border); color:var(--text3); font-style:italic; font-size:12px; border-bottom-left-radius:4px; }
.ai-msg.thinking::after { content:'...'; animation:dots 1.2s infinite; }
@keyframes dots { 0%,20%{content:'.'} 40%,60%{content:'..'} 80%,100%{content:'...'} }
.ai-input-row { display:flex; align-items:flex-end; gap:8px; padding:12px 14px; border-top:1px solid var(--border); flex-shrink:0; }
#ai-input {
  flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  padding:9px 12px; color:var(--text); font-family:var(--ui); font-size:13px;
  outline:none; resize:none; min-height:38px; max-height:110px; line-height:1.5;
  transition:border-color .15s;
}
#ai-input:focus { border-color:var(--purple); }
.ai-send {
  width:38px; height:38px;
  background:linear-gradient(135deg,var(--purple),#a78bfa);
  border:none; border-radius:10px; color:#fff;
  cursor:pointer; display:flex; align-items:center; justify-content:center;

def timer(func):
    def wrapper(*args, **kwargs):
        start = time.time()
        result = func(*args, **kwargs)
        print(f"{func.__name__} took {(time.time()-start)*1000:.2f}ms")
        return result
    return wrapper

def memoize(func):
    cache = {}
    def wrapper(*args):
        if args not in cache:
            cache[args] = func(*args)
        return cache[args]
    return wrapper

@timer
@memoize
def slow_fib(n):
    if n <= 1: return n
    return slow_fib(n-1) + slow_fib(n-2)

def flatten(lst):

// ─────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────
let pyodide = null;
let editor  = null;
let isRunning = false;
let fontSize = 14;
let stdinPromiseResolve = null;
let currentStdinLine  = null;
let currentStdinInput = null;

// File tabs state
let workspaceFiles = [
  { id: 'main', name: 'main.py', content: null, modified: false }
];
let activeFileId = 'main';
let openTabs = ['main']; // tab order

// Explorer section state
const sectionOpen = { ws: true, ex: true };
const folderOpen  = {};

// ─────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
    mode: 'python',
    theme: 'dracula',
    lineNumbers: true,
    autoCloseBrackets: true,
    matchBrackets: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    lineWrapping: false,
    keyMap: 'sublime',
    autoRefresh: true,
    extraKeys: {
      'Cmd-Enter':  runCode,
      'Ctrl-Enter': runCode,
      'Tab': (cm) => {
        if (cm.somethingSelected()) cm.indentSelection('add');
        else cm.replaceSelection('    ', 'end');
      }
    }
  });

  // Default main.py content
  const defaultCode = `# Welcome to PyWrite! 🐍
`;
  workspaceFiles[0].content = defaultCode;
  editor.setValue(defaultCode);

  editor.on('change', () => {
    const f = workspaceFiles.find(f => f.id === activeFileId);
    if (f && !f.example) {
      f.content = editor.getValue();
      if (!f.modified) { f.modified = true; renderTabs(); renderExplorer(); }
    }
  });

  buildExplorer();
  renderTabs();
  initPyodide();
  initResize();
  initAI();
  initLogin();
});

// ─────────────────────────────────────────────────────────────────
// EXPLORER
// ─────────────────────────────────────────────────────────────────
function buildExplorer() {
  renderWorkspaceFiles();
  renderExampleFolders();
}

function renderWorkspaceFiles() {
  const container = document.getElementById('ws-files');
  container.innerHTML = '';
  workspaceFiles.forEach(f => {
    const row = document.createElement('div');
    row.className = 'ws-file-row' + (f.id === activeFileId ? ' active' : '');
    row.onclick = () => openWorkspaceFile(f.id);
    row.innerHTML = `
      <span style="font-size:13px;flex-shrink:0">🐍</span>
      <span class="ws-filename">${f.name}</span>
      ${f.modified ? '<span style="width:6px;height:6px;border-radius:50%;background:var(--yellow);flex-shrink:0;display:inline-block"></span>' : ''}
    `;
    container.appendChild(row);
  });
}

function renderExampleFolders() {
  const container = document.getElementById('ex-folders');
  container.innerHTML = '';
  EXAMPLE_FOLDERS.forEach(folder => {
    const isOpen = folderOpen[folder.id] !== false;

    const folderRow = document.createElement('div');
    folderRow.className = 'folder-row' + (isOpen ? '' : ' collapsed');
    folderRow.onclick = () => toggleFolder(folder.id);
    folderRow.innerHTML = `
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      <span class="folder-icon">${isOpen ? '📂' : '📁'}</span>
      <span class="folder-label">${folder.label}/</span>
    `;
    container.appendChild(folderRow);

    const fileList = document.createElement('div');
    fileList.className = 'file-list' + (isOpen ? '' : ' collapsed');
    fileList.id = 'folder-files-' + folder.id;

    folder.files.forEach(file => {
      const isActive = activeFileId === 'ex-' + file.id;
      const fileRow = document.createElement('div');
      fileRow.className = 'file-row' + (isActive ? ' active' : '');
      fileRow.onclick = () => openExampleFile(folder, file);
      fileRow.innerHTML = `
        <span class="file-icon">🐍</span>
        <span class="file-name">${file.name}</span>
      `;
      fileList.appendChild(fileRow);
    });

    container.appendChild(fileList);
  });
}

function renderExplorer() {
  renderWorkspaceFiles();
  renderExampleFolders();
}

function toggleSection(id) {
  sectionOpen[id] = !sectionOpen[id];
  const hdr  = document.getElementById(id + '-hdr');
  const body = document.getElementById(id + '-body');
  hdr.classList.toggle('collapsed', !sectionOpen[id]);
  body.classList.toggle('collapsed', !sectionOpen[id]);
}

function toggleFolder(folderId) {
  const isOpen = folderOpen[folderId] !== false;
  folderOpen[folderId] = !isOpen;
  renderExampleFolders();
}

function toggleExplorer() {
  const ex  = document.getElementById('explorer');
  const btn = document.getElementById('act-explorer');
  ex.classList.toggle('hidden');
  btn.classList.toggle('active');
}

// ─────────────────────────────────────────────────────────────────
// FILE TABS
// ─────────────────────────────────────────────────────────────────
function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  openTabs.forEach(tabId => {
    const wsFile = workspaceFiles.find(f => f.id === tabId);
    let name, isExample = false, folder = null;

    if (wsFile) {
      name = wsFile.name;
    } else if (tabId.startsWith('ex-')) {
      const key = tabId.slice(3);
      for (const f of EXAMPLE_FOLDERS) {
        const match = f.files.find(fi => fi.id === key);
        if (match) { name = match.name; folder = f.label; break; }
      }
      isExample = true;
    }

    const isActive = tabId === activeFileId;
    const isModified = wsFile && wsFile.modified;

    const tab = document.createElement('div');
    tab.className = 'tab' + (isActive ? ' active' : '');
    tab.onclick = () => switchTab(tabId);
    tab.innerHTML = `
      <span class="tab-icon">🐍</span>
      <span>${name || tabId}</span>
      ${isModified ? '<span class="tab-dot"></span>' : ''}
      <span class="tab-close" onclick="closeTab(event,'${tabId}')">✕</span>
    `;
    bar.appendChild(tab);
  });

  updateBreadcrumb();
}

function switchTab(tabId) {
  // Save current editor content
  const current = workspaceFiles.find(f => f.id === activeFileId);
  if (current) current.content = editor.getValue();

  activeFileId = tabId;
  loadTabContent(tabId);
  renderTabs();
  renderExplorer();
}

function loadTabContent(tabId) {
  const wsFile = workspaceFiles.find(f => f.id === tabId);
  if (wsFile) {
    editor.setValue(wsFile.content || '');
    editor.setOption('readOnly', false);
  } else if (tabId.startsWith('ex-')) {
    const key = tabId.slice(3);
    editor.setValue(SNIPPETS[key] || '');
    editor.setOption('readOnly', false);
  }
  editor.refresh();
}

function closeTab(e, tabId) {
  e.stopPropagation();
  openTabs = openTabs.filter(t => t !== tabId);
  if (openTabs.length === 0) {
    openTabs = ['main'];
    activeFileId = 'main';
  } else if (activeFileId === tabId) {
    activeFileId = openTabs[openTabs.length - 1];
    loadTabContent(activeFileId);
  }
  renderTabs();
  renderExplorer();
}

function updateBreadcrumb() {
  const bcPath = document.getElementById('bc-path');
  const bcFile = document.getElementById('bc-file');
  if (activeFileId.startsWith('ex-')) {
    const key = activeFileId.slice(3);
    for (const f of EXAMPLE_FOLDERS) {
      const match = f.files.find(fi => fi.id === key);
      if (match) { bcPath.textContent = 'examples / ' + f.label; bcFile.textContent = match.name; break; }
    }
  } else {
    const wsFile = workspaceFiles.find(f => f.id === activeFileId);
    bcPath.textContent = 'workspace';
    bcFile.textContent = wsFile ? wsFile.name : activeFileId;
  }
}

// ─────────────────────────────────────────────────────────────────
// OPEN FILES
// ─────────────────────────────────────────────────────────────────
function openWorkspaceFile(fileId) {
  const current = workspaceFiles.find(f => f.id === activeFileId);
  if (current) current.content = editor.getValue();

  activeFileId = fileId;
  if (!openTabs.includes(fileId)) openTabs.push(fileId);
  loadTabContent(fileId);
  renderTabs();
  renderExplorer();
}

function openExampleFile(folder, file) {
  const tabId = 'ex-' + file.id;
  const current = workspaceFiles.find(f => f.id === activeFileId);
  if (current) current.content = editor.getValue();

  activeFileId = tabId;
  if (!openTabs.includes(tabId)) openTabs.push(tabId);
  loadTabContent(tabId);
  renderTabs();
  renderExplorer();
}

function createNewFile() {
  const name = prompt('File name:');
  if (!name) return;
  const safeName = name.endsWith('.py') ? name : name + '.py';
  const id = 'ws-' + Date.now();
  workspaceFiles.push({ id, name: safeName, content: `# ${safeName}\n`, modified: false });
  openWorkspaceFile(id);
}

// ─────────────────────────────────────────────────────────────────
// PYODIDE
// ─────────────────────────────────────────────────────────────────
async function initPyodide() {
  const fill = document.getElementById('loader-fill');
  const txt  = document.getElementById('loader-text');
  try {
    fill.style.width = '20%';
    txt.textContent = 'Loading Pyodide…';
    pyodide = await loadPyodide();
    fill.style.width = '80%';
    txt.textContent = 'Setting up Python environment…';

    pyodide.globals.set('_js_prompt', (msg) => new Promise(resolve => {
      if (stdinPromiseResolve) { stdinPromiseResolve(''); stdinPromiseResolve = null; }
      stdinPromiseResolve = resolve;
      showInlineInput(msg || '');
    }));
    pyodide.globals.set('_js_write', (msg) => { const t = String(msg); if (t) printLine(t, 'stdout'); });
    pyodide.globals.set('_js_error', (msg) => { const t = String(msg); if (t) printLine(t, 'stderr'); });

    pyodide.runPython(`
import builtins
async def _patched_input(prompt=''):
    result = await _js_prompt(str(prompt) if prompt else '')
    return result if result is not None else ''
builtins.input = _patched_input
`);

    pyodide.runPython(`
import ast

class InputAwaiter(ast.NodeTransformer):
    def visit_Call(self, node):
        self.generic_visit(node)
        if isinstance(node.func, ast.Name) and node.func.id == 'input':
            return ast.Await(value=node)
        if isinstance(node.func, ast.Attribute) and not isinstance(node.func.value, ast.Await):
            if self._is_input_chain(node.func.value):
                node.func.value = ast.Await(value=node.func.value)
                return node
        return node

    def _is_input_chain(self, node):
        if isinstance(node, ast.Call):
            if isinstance(node.func, ast.Name) and node.func.id == 'input':
                return True
            if isinstance(node.func, ast.Attribute):
                return self._is_input_chain(node.func.value)
        return False

def transform_input_calls(source):
    tree = ast.parse(source)
    tree = InputAwaiter().visit(tree)
    ast.fix_missing_locations(tree)
    wrapper = ast.AsyncFunctionDef(
        name='__pywrite_main',
        args=ast.arguments(posonlyargs=[], args=[], vararg=None,
                           kwonlyargs=[], kw_defaults=[], kwarg=None, defaults=[]),
        body=tree.body,
        decorator_list=[], returns=None, type_comment=None,
    )
    module = ast.Module(body=[wrapper], type_ignores=[])
    ast.fix_missing_locations(module)
    return ast.unparse(module)
`);

    fill.style.width = '100%';
    txt.textContent = 'Ready!';
    setTimeout(() => {
      document.getElementById('loading-overlay').classList.add('hidden');
      document.getElementById('run-btn').disabled = false;
      editor.refresh();
      printWelcome();
    }, 350);

  } catch(e) {
    txt.textContent = 'Failed: ' + e.message;
    fill.style.background = 'var(--warn)';
  }
}

// ─────────────────────────────────────────────────────────────────
// OUTPUT
// ─────────────────────────────────────────────────────────────────
function printLine(text, cls='stdout') {
  const out = document.getElementById('output');
  text.split('\n').forEach((line, i, arr) => {
    if (i === arr.length - 1 && line === '') return;
    const span = document.createElement('span');
    span.className = 'out-line ' + cls;
    span.textContent = line;
    out.appendChild(span);
  });
  out.scrollTop = out.scrollHeight;
}

function printWelcome() {
  const out = document.getElementById('output');
  out.innerHTML = '';
  printLine('PyWrite  •  Python 3.12 (Pyodide)', 'welcome');
  printLine('Ctrl+Enter to run  •  Click a file in the explorer to open it.', 'info');
}

function clearOutput() {
  document.getElementById('output').innerHTML = '';
  setStatus('');
  stdinPromiseResolve = null;
  currentStdinLine = null;
  currentStdinInput = null;
}

function setStatus(s) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot' + (s ? ' ' + s : '');
}

// ─────────────────────────────────────────────────────────────────
// INLINE STDIN
// ─────────────────────────────────────────────────────────────────
function showInlineInput(promptText) {
  const out = document.getElementById('output');
  const line = document.createElement('div');
  line.className = 'out-line stdin-line';

  const prompt = document.createElement('span');
  prompt.className = 'stdin-prompt-text';
  prompt.textContent = promptText;

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'stdin-inline-input';
  inp.placeholder = 'type here, press Enter…';
  inp.autocomplete = 'off';
  inp.autocorrect = 'off';
  inp.autocapitalize = 'off';
  inp.spellcheck = false;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitInlineInput(); } });

  line.appendChild(prompt);
  line.appendChild(inp);
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
  currentStdinLine  = line;
  currentStdinInput = inp;
  setTimeout(() => inp.focus(), 10);
}

function submitInlineInput() {
  if (!currentStdinInput || !currentStdinLine) return;
  const value = currentStdinInput.value;
  currentStdinInput.remove();
  const typed = document.createElement('span');
  typed.className = 'stdin-typed-value';
  typed.textContent = value;
  currentStdinLine.appendChild(typed);
  currentStdinLine  = null;
  currentStdinInput = null;
  if (stdinPromiseResolve) { stdinPromiseResolve(value); stdinPromiseResolve = null; }
}

// ─────────────────────────────────────────────────────────────────
// RUN CODE
// ─────────────────────────────────────────────────────────────────
async function runCode() {
  if (!pyodide || isRunning) return;
  isRunning = true;
  setStatus('running');
  document.getElementById('run-btn').disabled = true;
  clearOutput();
  printLine('▶ Running…', 'info');

  const code = editor.getValue();
  const t0 = performance.now();
  const NL = String.fromCharCode(10);

  // Build capture script without \n inside string literals
  const captureLines = [
    'import sys, io',
    'class _Out(io.StringIO):',
    '    def __init__(self, cb):',
    '        super().__init__()',
    '        self._buf = ""',
    '        self._cb = cb',
    '    def write(self, s):',
    '        if s is None: return 0',
    '        self._buf += str(s)',
    '        nl = chr(10)',
    '        while nl in self._buf:',
    '            line, self._buf = self._buf.split(nl, 1)',
    '            self._cb(line)',
    '        return len(s)',
    '    def flush(self):',
    '        if self._buf: self._cb(self._buf); self._buf = ""',
    'sys.stdout = _Out(_js_write)',
    'sys.stderr = _Out(_js_error)',
  ];
  const captureScript = captureLines.join(NL);

  let transformedCode = null;
  if (code.includes('input(')) {
    try {
      const transform = pyodide.globals.get('transform_input_calls');
      const result = transform(code);
      transformedCode = result.toJs ? result.toJs() : String(result);
      if (typeof result.destroy === 'function') result.destroy();
    } catch(err) {
      printLine('Transform error: ' + err.message, 'stderr');
    }
  }

  try {
    pyodide.runPython(captureScript);
    if (transformedCode) {
      pyodide.runPython(transformedCode);
      await pyodide.runPythonAsync('await __pywrite_main()');
    } else {
      await pyodide.runPythonAsync(code);
    }
    try { pyodide.runPython('import sys; sys.stdout=sys.__stdout__; sys.stderr=sys.__stderr__'); } catch(_){}
    const elapsed = (performance.now() - t0).toFixed(1);
    setStatus('ok');
    printLine('✓ Done in ' + elapsed + 'ms', 'timing');
  } catch(e) {
    try { pyodide.runPython('import sys; sys.stdout=sys.__stdout__; sys.stderr=sys.__stderr__'); } catch(_){}
    (e.message || String(e)).split('\n').forEach(l => printLine(l, 'stderr'));
    setStatus('error');
  }

  if (currentStdinInput) { currentStdinInput.disabled = true; currentStdinInput.placeholder = '(ended)'; }
  stdinPromiseResolve = null; currentStdinLine = null; currentStdinInput = null;
  isRunning = false;
  document.getElementById('run-btn').disabled = false;
}

// ─────────────────────────────────────────────────────────────────
// MISC
// ─────────────────────────────────────────────────────────────────
function downloadCode() {
  const wsFile = workspaceFiles.find(f => f.id === activeFileId);
  const name = wsFile ? wsFile.name : 'main.py';
  const blob = new Blob([editor.getValue()], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

function changeFontSize(d) {
  fontSize = Math.min(24, Math.max(10, fontSize + d));
  document.querySelector('.CodeMirror').style.fontSize = fontSize + 'px';
  editor.refresh();
}

function initResize() {
  const handle = document.getElementById('resize-handle');
  const panel  = document.getElementById('output-panel');
  const ws     = document.querySelector('.workspace');
  let startY, startH;
  handle.addEventListener('mousedown', e => {
    startY = e.clientY; startH = panel.offsetHeight;
    const onMove = e2 => {
      const newH = Math.min(Math.max(80, startH + startY - e2.clientY), ws.offsetHeight - 100);
      panel.style.height = newH + 'px';
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', () => document.removeEventListener('mousemove', onMove), { once: true });
  });
}

function initLogin() {

function logoClick() {

function openAI() {
  if (localStorage.getItem('pywrite_auth') !== '1') {
    document.getElementById('login-overlay').classList.remove('hidden');
    return;
  }
  document.getElementById('ai-panel').classList.add('open');
  setTimeout(() => document.getElementById('ai-input').focus(), 100);
}
function closeAI() { document.getElementById('ai-panel').classList.remove('open'); }

function appendMsg(role, text) {
  const box = document.getElementById('ai-msgs');
  const d = document.createElement('div');
  d.className = 'ai-msg ' + role;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

async function sendAI() {
  const inp = document.getElementById('ai-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';
  document.getElementById('ai-send').disabled = true;
  appendMsg('user', text);
  aiMsgs.push({ role: 'user', content: text });

  const thinking = appendMsg('thinking', 'Thinking');
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_KEY },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          { role: 'system', content: 'You are a helpful Python coding assistant in PyWrite. Be concise.' },
          ...aiMsgs
        ],
        max_tokens: 1024
      })
    });
    const data = await res.json();
    thinking.remove();
    if (data.error) { appendMsg('sys', '⚠ ' + data.error.message); aiMsgs.pop(); }
    else {
      const reply = data.choices?.[0]?.message?.content || 'No response.';
      aiMsgs.push({ role: 'assistant', content: reply });
      appendMsg('assistant', reply);
    }
  } catch(e) {
    thinking.remove();
    appendMsg('sys', '⚠ ' + e.message);
    aiMsgs.pop();
  }
  document.getElementById('ai-send').disabled = false;
  document.getElementById('ai-input').focus();
}

function initAI() {
  document.getElementById('ai-panel').addEventListener('click', e => { if (e.target.id === 'ai-panel') closeAI(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('ai-panel').classList.contains('open')) closeAI(); });
  const inp = document.getElementById('ai-input');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAI(); } });
  inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 110) + 'px'; });
}
